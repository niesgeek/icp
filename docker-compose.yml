services:
  icp:
    build: .
    image: moe-icp:latest
    container_name: moe-icp
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DB_PATH: /app/data/icp.db
      # 生产务必设置一个强口令；留空则审核/注销不鉴权（仅演示）。
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    volumes:
      - icp-data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  icp-data:
